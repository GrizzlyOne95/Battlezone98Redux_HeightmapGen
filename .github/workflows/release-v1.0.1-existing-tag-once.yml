name: Release Heightmap Generator v1.0.1 Existing Tag Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1.0.1-existing-tag-once.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout clean v1.0.1 source
        uses: actions/checkout@v4
        with:
          ref: 4f7f83645b9e51372d76e5b9b68af56722d22f09
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify release version
        shell: pwsh
        run: |
          $actual = python heightmap_generator.py --version
          if ($actual -notmatch '1\.0\.1') { throw "Expected v1.0.1, got $actual" }

      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name BZR_Heightmap_Generator heightmap_generator.py

      - name: Smoke test frozen executable version
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\BZR_Heightmap_Generator.exe" -ArgumentList "--version" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen executable smoke test failed with exit code $($process.ExitCode)" }

      - name: Create and push v1.0.1 tag first
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1.0.1 4f7f83645b9e51372d76e5b9b68af56722d22f09 -m "Release v1.0.1"
          git push origin refs/tags/v1.0.1

      - name: Create v1.0.1 GitHub Release from existing tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          files: dist/BZR_Heightmap_Generator.exe
          name: Release v1.0.1
          body_path: docs/RELEASE_NOTES_v1.0.1.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
