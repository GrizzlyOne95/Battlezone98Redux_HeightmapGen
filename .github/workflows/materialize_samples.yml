name: Materialize terrain samples

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate-samples:
    if: github.head_ref == 'agent/corpus-driven-terrain-grammar'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate sample corpus
        run: python scripts/generate_samples.py

      - name: Commit generated samples
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples
          if git diff --cached --quiet; then
            echo "Sample corpus already up to date."
            exit 0
          fi
          git commit -m "Add generated terrain sample corpus"
          git push origin "HEAD:${BRANCH}"
