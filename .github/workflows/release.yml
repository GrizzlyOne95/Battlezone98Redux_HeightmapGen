name: Release Heightmap Generator

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify release version
        shell: pwsh
        run: |
          $expected = "${env:GITHUB_REF_NAME}".TrimStart('v')
          $actual = python heightmap_generator.py --version
          if ($actual -notmatch [regex]::Escape($expected)) {
            throw "Version mismatch: tag=$expected output=$actual"
          }

      - name: Generate application icon
        run: python scripts/generate_app_icon.py branding/repo_icon.svg bzr_heightmap.ico --png branding/app_icon.png

      - name: Generate Windows version metadata
        run: python scripts/generate_version_info.py --version "${{ github.ref_name }}" --output branding/version_info.txt

      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name BZHeightmapGenerator --icon bzr_heightmap.ico --version-file branding/version_info.txt --add-data "bzr_heightmap.ico;." --add-data "branding/app_icon.png;branding" --add-data "branding/app_icon.ico;branding" --runtime-hook branding/pyinstaller_icon_hook.py heightmap_generator.py

      - name: Smoke test frozen executable version
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\BZHeightmapGenerator.exe" -ArgumentList "--version" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen executable version smoke test failed with exit code $($process.ExitCode)" }

      - name: Package Windows release archive
        shell: pwsh
        run: |
          $archive = "Battlezone98Redux_HeightmapGen-${env:GITHUB_REF_NAME}-windows.zip"
          Compress-Archive -Path ".\dist\BZHeightmapGenerator.exe" -DestinationPath ".\dist\$archive" -Force
          Get-Item ".\dist\$archive"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Battlezone98Redux_HeightmapGen-v*-windows.zip
          fail_on_unmatched_files: true
          name: Release ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES_${{ github.ref_name }}.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
