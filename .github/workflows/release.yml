name: Release Heightmap Generator

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $version = (Get-Content VERSION).Trim()
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify release version
        shell: pwsh
        run: |
          $expected = "${{ steps.version.outputs.version }}"
          $actual = python heightmap_generator.py --version
          if ($actual -notmatch [regex]::Escape($expected)) {
            throw "Version mismatch: expected=$expected output=$actual"
          }

      - name: Generate application icon
        run: python scripts/generate_app_icon.py branding/repo_icon.svg bzr_heightmap.ico --png branding/app_icon.png

      - name: Generate Windows version metadata
        run: python scripts/generate_version_info.py --version "${{ steps.version.outputs.version }}" --output branding/version_info.txt

      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name BZHeightmapGenerator --icon bzr_heightmap.ico --version-file branding/version_info.txt --add-data "VERSION;." --add-data "bzr_heightmap.ico;." --add-data "branding/app_icon.png;branding" --add-data "branding/app_icon.ico;branding" --runtime-hook branding/pyinstaller_icon_hook.py heightmap_generator.py

      - name: Smoke test frozen executable version
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\BZHeightmapGenerator.exe" -ArgumentList "--version" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen executable version smoke test failed with exit code $($process.ExitCode)" }

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v$((Get-Content VERSION).Trim())"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Package Windows release archive
        shell: pwsh
        run: |
          $archive = "Battlezone98Redux_HeightmapGen-${{ steps.release.outputs.tag }}-windows.zip"
          Compress-Archive -Path ".\dist\BZHeightmapGenerator.exe" -DestinationPath ".\dist\$archive" -Force
          Get-Item ".\dist\$archive"

      - name: Create GitHub Release
        if: "${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release): v')) }}"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Release ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/Battlezone98Redux_HeightmapGen-v*-windows.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
