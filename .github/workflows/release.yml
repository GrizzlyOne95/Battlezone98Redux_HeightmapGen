name: Release Heightmap Generator

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify release version
        shell: pwsh
        run: |
          $expected = "${env:GITHUB_REF_NAME}".TrimStart('v')
          $actual = python heightmap_generator.py --version
          if ($actual -notmatch [regex]::Escape($expected)) {
            throw "Version mismatch: tag=$expected output=$actual"
          }

      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name BZR_Heightmap_Generator heightmap_generator.py

      - name: Smoke test frozen executable version
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\BZR_Heightmap_Generator.exe" -ArgumentList "--version" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen executable version smoke test failed with exit code $($process.ExitCode)" }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BZR_Heightmap_Generator.exe
          name: Release ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES_${{ github.ref_name }}.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
